; SoftAudit site config - copy to Sites\<SITE>.ini (LITV.ini, HOT.ini, LDS.ini, Coralis.ini).
; Real site files are NOT committed (.gitignore): this repo is public and they hold the Drive upload URL.
; Same values as SM-Tool\Sites\<SITE>.psd1.

; Site name sent to Apps Script -> Drive folder DATA/<SITE>/SoftAudit (LITV, HOT, LDS, Coralis)
SiteName=LITV

; Apps Script web app shared with SM-Tool. Empty = skip Drive.
DriveUploadUrl=

; Network folder used when Drive fails. Empty = skip. The last folder is created if missing.
SharePath=\\server\share\DATA\SoftAudit
